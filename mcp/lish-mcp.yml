candidate_server:
  name: lish-content
  description: Read-only access to Lish blog posts, marketing pages and media.
  transport: stdio
  auth: none
  base_url: https://www.lishfood.com/wp-json/wp/v2
  read_only: true
  rationale: 'Every operation in the derived spec is a safe GET against an anonymous read surface, so
