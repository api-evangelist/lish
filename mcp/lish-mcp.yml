implementation_notes:
- Always request _fields to trim responses — full post objects embed rendered HTML and will blow an agent's
  context window on a list call.
- Paginate by following the rel="next" Link header and stopping when it is absent. Requesting a page past
  the end returns HTTP 400 rest_post_invalid_page_number, not an empty array.
- Returned `link` fields and Link headers use the wordpress.lishfood.com origin; rewrite to www.lishfood.com
  before surfacing URLs to a user.
- Strip or sanitize the rendered HTML in content.rendered before passing it to a model.
