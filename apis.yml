x-no-product-api-note: >-
  Lish publishes no product API, developer portal, SDK, CLI, MCP server, webhook
  surface or status page. Probed 2026-07-19: api.lishfood.com,
  developers.lishfood.com and status.lishfood.com do not resolve, and every
  /.well-known/ path returns 404. The API profiled below is the WordPress REST
  API that backs the marketing site — a CMS byproduct with no stability contract.
