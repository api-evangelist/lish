aid: lish
name: Lish
description: >-
  Lish is a corporate catering and workplace food service company serving Seattle
  and the Bellevue/Eastside area of Washington, including Redmond and Kirkland. It
  connects employers with a curated roster of local partner chefs and runs the
  whole workplace meal program — menu curation, ordering, delivery and setup —
  across four service lines: subscription catering, PopUp restaurants that
  employees buy from directly, on-demand one-off catering, and occasion catering
  for breakfast, lunch, box lunches, happy hours, meetings and events. The company
  reports more than 3,000,000 meals served, 100+ curated menus from dozens of
  partner chefs, an average meal rating of 4.6 stars, and 97.8% of orders
  delivered on time within a 20-minute window, with dietary accommodation
  (gluten-free, vegetarian, vegan, dairy-free) as a stated focus. Lish describes
  an admin dashboard, budget tracking, GPS delivery tracking, Google Calendar and
  Outlook menu visibility and Slack feedback notifications, but these are end-user
  product integrations — Lish operates no developer program and publishes no
  product API. The only public, self-describing HTTP API is the WordPress REST API
  behind its marketing site, profiled here.
